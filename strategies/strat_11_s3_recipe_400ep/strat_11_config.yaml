# strat_11_s3_recipe_400ep: every hyperparameter of the spec (strategy.md). No magic numbers in code.
seed: 0

model:                      # post-activation ResNet, ReLU(S(x) + F(x)), F = conv-BN-ReLU-conv-BN
  widths: [64, 128, 256]
  blocks: [3, 3, 3]
  num_classes: 10

expected_params: 4327754    # spec: assert total == this
param_limit: 5000000        # competition rule

data:
  mean: [0.4914, 0.4822, 0.4465]   # train statistics only
  std: [0.2470, 0.2435, 0.2616]
  full_train: false                # train = 50k minus val_idx (45k)

train:
  epochs: 400
  batch_size: 256
  drop_last: true           # 45000 // 256 = 175 steps per epoch
  lr: 0.2
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005      # on all parameters, BN and bias included
  warmup_epochs: 2          # lr = lr * (step + 1) / warmup_steps, then cosine to zero
  label_smoothing: 0.1
  ema_decay: 0.999          # from step 0; parameters and float buffers are averaged, integer buffers copied
  amp_dtype: fp16           # T4: fp16 autocast + GradScaler (CUDA only)
  channels_last: true
  cudnn_benchmark: true
  workers: 4                # per-image TrivialAugment needs CPU workers (spec overrides the no-DataLoader rule)

augment:                    # per image, in this order
  crop_padding: 4
  pad_mode: constant
  random_erasing: 0.25      # after normalization, fill 0

eval:
  every: 10                 # VAL5K EMA + live, no TTA; no effect on the final weights
  batch_size: 500
  tta6_weights: [0.25, 0.25, 0.125, 0.125, 0.125, 0.125]   # id, flip, s(-1,-1), s(+1,+1), flip+s(-1,-1), flip+s(+1,+1)
  tta6_shift_pad: 1
  submit_weights: ema       # fixed before training, as in the S3 recipe: no selection on VAL5K
  submit_tta: flip2

checkpoint:
  every: 5

kill:
  max_projected_min: 120    # exit 2 after epoch 3 if epochs x t_epoch exceeds this
  t_epoch_epochs: [2, 3]    # 1-indexed
  val_check_frac: 0.25      # at the end of epoch ceil(frac * epochs)
  val_min_acc: 0.80
  max_nonfinite_per_epoch: 10

smoke:                      # --smoke. On GPU: full data for 3 epochs, measures the real t_epoch.
  gpu_epochs: 3
  cpu_n_train: 1024         # local CPU: code path only, < 3 min
  cpu_batch_size: 128
  cpu_epochs: 2
  cpu_val_n: 256
