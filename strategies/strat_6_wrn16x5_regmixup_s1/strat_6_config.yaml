# strat_6_wrn16x5_regmixup_s1: every hyperparameter of the spec (strategy.md). No magic numbers in code.
seed: 1

model:                      # pre-activation WRN-16-5
  in_channels: 3
  stem_channels: 16
  widths: [80, 160, 320]
  blocks_per_stage: 2
  first_strides: [1, 2, 2]
  num_classes: 10

expected_params: 4289754    # spec: assert total == this
param_limit: 5000000        # competition rule

data:
  mean: [0.4914, 0.4822, 0.4465]   # train statistics only
  std: [0.2470, 0.2435, 0.2616]
  pad: 4                            # reflect pre-pad 32 -> 40
  pad_mode: reflect
  full_train: false                 # train = 50k minus val_idx (45k)

train:
  batch_size: 512
  drop_last: true                   # 45000 // 512 = 87 steps per epoch
  momentum: 0.9
  nesterov: true
  dampening: 0.0
  weight_decay: 5.0e-4              # conv weights + Linear weight; 0 for BN and Linear bias
  label_smoothing: 0.1
  warmup_epochs: 3                  # steps 0..W-1, linear warmup_lr_start -> lr_peak
  warmup_lr_start: 0.04
  lr_peak: 0.4                      # then lr = lr_peak * (1 - q), q = clip(max(q_step, q_time), 0, 1)
  ema_decay: 0.999                  # EMA created at end of warmup, updated every step after
  amp_dtype: fp16                   # T4: fp16 autocast + GradScaler (CUDA only)
  grad_scaler_init_scale: 65536.0
  channels_last: true
  cudnn_benchmark: true
  compile: false                    # enable only if GPU smoke shows compile time < 10% of the run

augment:                            # GPU, per batch, in this order: crop, flip, normalize, cutout
  crop_size: 32
  flip_p: 0.5
  cutout_size: 16                   # rows cy-8..cy+7, cols cx-8..cx+7, clipped
  cutout_p: 1.0
  cutout_fill: 0.0                  # after normalization

schedule:
  time_budget_min: 185               # M; --time-budget-min overrides
  e_rule_epoch: 3                   # E is set at the end of this epoch
  t_epoch_epochs: [2, 3]            # t_epoch = mean wall time of these epochs (1-indexed)
  e_reserve_s: 360                  # E budget = M*60 - reserve = 10740 s
  e_max: 300
  e_round: 5
  e_min: 80                         # throughput kill if E < this

eval:
  every: 10                         # VAL5K live + EMA, no TTA
  batch_size: 1000
  tta6_weights: [0.25, 0.25, 0.125, 0.125, 0.125, 0.125]   # id, flip, s(-1,-1), s(+1,+1), flip+s(-1,-1), flip+s(+1,+1)
  tta6_shift_pad: 1

checkpoint:
  every: 5                          # plus end of e_rule_epoch and end of training

kill:
  val_check_frac: 0.25              # at end of epoch ceil(frac * E)
  val_min_acc: 0.80
  max_nonfinite_per_epoch: 10
  short_frac: 0.85                  # completed epochs < frac * E -> SHORT run

smoke:                              # --smoke overrides (code-path test; local CPU must finish < 3 min)
  n_train: 512                      # first 512 train (non-VAL5K) images
  batch_size: 128                   # 4 steps per epoch
  epochs: 2                         # fixed E (no E rule)
  warmup_epochs: 1
  eval_every: 1
  ckpt_every: 1
  kill_rules: false
  val_n: 256                        # first 256 of val_idx
  tta6_test: false                  # skip the 4 shifted test views (CPU time); val still runs all 6 views

regmixup:
  alpha: 20                         # lambda ~ Beta(alpha, alpha), one draw per batch; eta = 1
